name: CI

on:
  push:
    branches-ignore:
      - "dependabot/**"
      - "daily-test-sync"
    paths-ignore:
      - "docs/**"
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        python-version:
          - '3.12'
          - '3.14.9'
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build and install package
      shell: bash
      run: |
        python -m pip install --upgrade pip build setuptools wheel
        python -m build --no-isolation
        python -m pip install dist/*.whl
    - name: Test with bikeshed
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        TESTS_DIR: ${{ github.workspace }}/tests
      run: |
        bikeshed --version
        bikeshed template > /dev/null
        bikeshed wpt --template > /dev/null
        bikeshed --no-update test --all --test-dir "$TESTS_DIR"

  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14.9'
    - uses: psf/black@26.10.1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -r .github/workflows/update-tests/requirements.txt
    - name: Lint with ruff
      run: |
        ruff check bikeshed

    - name: Lint with pylint
      run: |
        echo "::add-matcher::.github/workflows/pylint-problem-matcher.json"
        pylint bikeshed *.py .github/workflows/update-tests/*.py

    - name: Lint with mypy
      run: |
        mypy

    - name: Check MANIFEST.in
      run: |
        check-manifest --no-build-isolation
